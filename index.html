<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSLA Portal</title>
<style>
:root{--blue:#0b6ec4;--blue-dk:#08528f;--ink:#13202b;--ink2:#4d5a65;--mute:#87919a;
--line:#dde4ea;--bg:#f3f6f9;--card:#fff;--ok:#0b6b38;--okbg:#e6f4ec;
--wait:#8a5a00;--waitbg:#fdf2de;--redo:#a8321a;--redobg:#fdeae4;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:26px;font-weight:650}h2{font-size:20px;font-weight:650}h3{font-size:17px;font-weight:650}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{background:var(--card);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0}
.brand{font-weight:700;font-size:18px}
.brand span{font-weight:400;color:var(--ink2);font-size:14px;margin-left:8px}
.roles{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.roles button{border:1px solid var(--line);background:#fff;color:var(--ink2);
padding:8px 15px;border-radius:999px;font-size:14px;cursor:pointer}
.roles button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.who{background:var(--card);border-bottom:1px solid var(--line);padding:18px 0}
.who p{color:var(--ink2);font-size:15px;margin-top:4px}
.cols{display:grid;grid-template-columns:260px 1fr;gap:26px;padding:26px 0 70px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;
border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;font:inherit}
.step.on{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--ink2);
display:grid;place-items:center;font-size:14px;font-weight:650}
.step.on .num{background:var(--blue);color:#fff}
.step.done .num{background:var(--okbg);color:var(--ok)}
.step b{display:block;font-weight:600;font-size:15px}
.step small{color:var(--ink2);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
.card>h2+p,.card>h3+p{color:var(--ink2);margin-top:6px;font-size:15px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.t-ok{background:var(--okbg);color:var(--ok)}.t-wait{background:var(--waitbg);color:var(--wait)}
.t-redo{background:var(--redobg);color:var(--redo)}.t-none{background:var(--bg);color:var(--ink2)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:inherit;
font-weight:600;cursor:pointer}
.btn:hover{background:var(--blue-dk)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:7px 13px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
font:inherit;background:#fff;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.hint{font-size:13px;color:var(--ink2);margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--ink2);font-weight:600;padding:0 10px 8px 0}
td{padding:12px 10px 12px 0;border-top:1px solid var(--line);vertical-align:top}
.note{background:#eef5fb;border:1px solid #cfe2f3;border-radius:10px;padding:14px 16px;font-size:15px}
.warn{background:var(--waitbg);border:1px solid #f0d9a8;border-radius:10px;padding:14px 16px;font-size:15px}
.rowline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.empty{text-align:center;color:var(--ink2);padding:34px 10px;font-size:15px}
.kv{display:flex;gap:10px;font-size:15px;padding:8px 0;border-top:1px solid var(--line)}
.kv b{font-weight:600;min-width:180px;color:var(--ink2)}
.filerow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;
padding:12px 14px;margin-bottom:10px}
.filerow .n{width:28px;height:28px;border-radius:6px;background:var(--bg);display:grid;
place-items:center;font-weight:700;font-size:14px;flex:none}
.redoitem{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.said{background:var(--bg);border-radius:8px;padding:11px 13px;margin:9px 0;font-size:15px}
.big{font-size:17px}
.big h1{font-size:28px}.big h2{font-size:22px}.big h3{font-size:19px}
.big .card{padding:22px}
.big .btn{font-size:17px;padding:12px 24px;min-height:48px;min-width:150px;border-radius:9px}
.big .btn.sm{font-size:15px;padding:9px 16px;min-width:0;min-height:42px}
.big table{font-size:17px}
.big th{font-size:15px}
.big td{padding:16px 12px}
.big input,.big textarea,.big select{font-size:17px;padding:11px 13px}
.big label{font-size:15px}
.big .hint{font-size:15px}
.big .tag{font-size:15px;padding:4px 12px}
.mentorlist tr td{border-top:2px solid var(--line)}
.check{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
.check>div:first-child{position:sticky;top:12px}
@media(max-width:1100px){.check{grid-template-columns:1fr}
.check>div:first-child{position:static}}
.viewer{background:#5b6670;border-radius:10px;height:calc(100vh - 150px);min-height:540px;
display:flex;flex-direction:column;color:#fff;padding:0;overflow:hidden}
.vstage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:18px}
.sheet{background:#fff;color:var(--ink2);border-radius:3px;display:grid;place-items:center;
font-size:17px;box-shadow:0 3px 14px rgba(0,0,0,.35);flex:none}
.vbar{display:flex;gap:10px;align-items:center;justify-content:center;padding:11px;flex-wrap:wrap;
background:#4a545d;border-radius:10px 10px 0 0;position:sticky;top:0;z-index:2}
.vbtn{background:#eef1f3;color:#18222b;border:0;border-radius:7px;padding:9px 14px;font:inherit;
font-size:15px;font-weight:600;cursor:pointer;min-height:42px}
.vbtn:hover{background:#fff}
.vsep{width:1px;height:26px;background:#6d7780}
.zoomval{min-width:62px;text-align:center;font-size:16px;font-weight:650}
.task{border:2px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.task.ok{border-color:#a9d6bd;background:#f6fbf8}
.task.redo{border-color:#e8b3a3;background:#fdf7f5}
.task .tref{font-weight:700;font-size:18px}
.task .tt{color:var(--ink2);font-size:15px;margin-top:2px;line-height:1.4}
.task .sheetline{font-size:15px;color:var(--ink2);margin:10px 0 4px}
.bigbtn{font-size:16px;padding:11px 14px;min-height:46px;border-radius:8px;border:2px solid var(--line);
background:#fff;cursor:pointer;font-weight:650;font-family:inherit;flex:1}
.bigbtn.yes.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bigbtn.no.on{background:var(--redo);border-color:var(--redo);color:#fff}
.btnpair{display:flex;gap:8px}
.progressline{font-size:18px;font-weight:650;padding:12px 0}
</style>
</head>
<body>
<header><div class="wrap hrow">
<div class="brand">SSLA Portal<span>ISF Maritime and Offshore Institute</span></div>
<div class="roles" id="roles"></div>
</div></header>
<div class="who"><div class="wrap" id="who"></div></div>
<div class="wrap cols"><nav class="steps" id="steps"></nav><main id="panel"></main></div>
<script>
var MODULES=[
{id:1,name:"Safety, Emergency and Shipboard Familiarisation",tasks:114},
{id:2,name:"Machinery Operation and Watchkeeping",tasks:208},
{id:3,name:"Machinery and Ship Construction",tasks:187},
{id:4,name:"Machinery and Electrical Maintenance",tasks:157},
{id:5,name:"Troubleshooting, Automation and Control",tasks:85},
{id:6,name:"Management, Statutory and Environmental",tasks:70}];
var TOTAL_TASKS=MODULES.reduce(function(a,m){return a+m.tasks},0);
var me={name:"Arjun Mehta",sslap:"SSLAP/2026/0418",cdc:"MUM 123456",mobile:"+91 98200 11223",
company:"Meridian Lines",
ships:[{name:"ISF Meridian",type:"Container",imo:"9512345",owner:"Meridian Lines",
joined:"2026-04-12",left:"",port:"Singapore",
officers:[{n:"K. Subramanian",r:"Second Engineer"},{n:"A. Dsouza",r:"Third Engineer"}]}],
mods:{
1:{state:"done",mentor:"R. Venkatesan",sent:"2026-05-02",answered:112,
result:{interest:5,band:"More than 90%",note:"Good work. Your own readings throughout."}},
2:{state:"done",mentor:"S. Bhattacharya",sent:"2026-07-11",answered:196,
result:{interest:4,band:"71% to 90%",note:"Sound. Bunkering figures from a transfer you attended."}},
3:{state:"checking",mentor:"R. Venkatesan",sent:"2026-10-18",answered:181,result:null},
4:{state:"doing",mentor:null,sent:"",answered:94,result:null},
5:{state:"not",mentor:null,sent:"",answered:0,result:null},
6:{state:"not",mentor:null,sent:"",answered:0,result:null}}};
var FILES=[{n:"scan_part1.pdf",pages:84,mb:31},{n:"scan_part2.pdf",pages:96,mb:38}];
var REDO=[
{id:1,mod:3,ref:"A.6.4",state:"todo",files:[],
said:"The scavenge port timing is taken from the manual drawing, not your own engine. Give the measured figures with the date."},
{id:2,mod:3,ref:"B.7.2",state:"todo",files:[],
said:"The free surface moment is the worked example from the stability booklet. Use a real departure condition and give its date."},
{id:3,mod:3,ref:"A.9.1",state:"sent",files:[{n:"redo_A91.pdf",pages:3}],
said:"No maker or model given for the auxiliary engine."}];
var WAITING=[
{id:"w1",who:"Arjun Mehta",sslap:"SSLAP/2026/0418",co:"Meridian Lines",mod:4,sent:"02 Nov",days:2,prev:"R. Venkatesan (M1, M3)"},
{id:"w2",who:"Priya Nair",sslap:"SSLAP/2026/0421",co:"Meridian Lines",mod:2,sent:"28 Oct",days:7,prev:"S. Bhattacharya (M1)"},
{id:"w3",who:"Imran Shaikh",sslap:"SSLAP/2026/0433",co:"Coastal Carriers",mod:1,sent:"03 Nov",days:1,prev:"none yet"}];
var MENTORS=[
{name:"R. Venkatesan",rank:"Chief Engineer (MEO Class I)",mods:[1,3,4],load:2,turn:6},
{name:"S. Bhattacharya",rank:"Chief Engineer (MEO Class I)",mods:[2,4,5],load:5,turn:11},
{name:"V. Pillai",rank:"Second Engineer (MEO Class II)",mods:[1,2,6],load:1,turn:8}];
var MYWORK=[
{id:"m1",who:"Arjun Mehta",sslap:"SSLAP/2026/0418",mod:3,tasks:187,done:94,redo:11,started:"3 Nov",sheets:203},
{id:"m2",who:"Priya Nair",sslap:"SSLAP/2026/0421",mod:1,tasks:114,done:0,redo:0,started:null,sheets:132}];
var FINISHED=[{who:"Arjun Mehta",mod:1,signed:"05 May 2026",band:"More than 90%"}];
var DEMO=[
{ref:"A.6.1",t:"Main engine — bedplate and frame",sheet:12},
{ref:"A.6.2",t:"Crankshaft and bearings",sheet:14},
{ref:"A.6.3",t:"Cylinder liner and cooling",sheet:17},
{ref:"A.6.4",t:"Scavenge ports and timing",sheet:19},
{ref:"A.7.1",t:"Fuel injection equipment",sheet:23},
{ref:"B.1.1",t:"Transverse stability — the ship as found",sheet:41}];
var marks={};
var E=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function mod(i){for(var k=0;k<MODULES.length;k++)if(MODULES[k].id===i)return MODULES[k]}
var STATE={done:["Checked","t-ok"],checking:["With your mentor","t-wait"],
waiting:["Waiting for ISF to allocate","t-wait"],doing:["You are on this one","t-none"],
not:["Not started","t-none"]};
var role="cand",step=1,sendMod=4,openModule=null,zoom=100,sheetNo=1;
var ROLES=[["cand","Candidate"],["mentor","Mentor"],["isf","ISF admin"],["co","Company"]];
var STEPS={
cand:[["Your ship","Fill this in first"],["Send a module","Attach your sheets"],
["Tasks to redo","What your mentor sent back"],["Your results","What you scored"]],
mentor:[["Modules to check","Allocated to you by ISF"],["Finished","Modules you have signed"]],
isf:[["Waiting to allocate","Choose a mentor"],["All candidates","Everyone on the programme"],
["Accounts","Create a login"]],
co:[["Our candidates","How they are getting on"],["Their results","Signed modules"]]};
function shell(){
document.getElementById("roles").innerHTML=ROLES.map(function(r){
return '<button data-r="'+r[0]+'" class="'+(role===r[0]?"on":"")+'">'+r[1]+'</button>'}).join("");
[].forEach.call(document.querySelectorAll("#roles button"),function(b){
b.onclick=function(){role=b.dataset.r;step=1;openModule=null;shell()}});
var w={cand:["Arjun Mehta","Candidate · "+me.sslap+" · Meridian Lines"],
mentor:["R. Venkatesan","IMOI Mentor · approved for Modules 1, 3 and 4"],
isf:["ISF administrator","You allocate every module and manage every login"],
co:["Meridian Lines","Training officer · 2 candidates on the programme"]}[role];
document.getElementById("who").innerHTML="<h1>"+E(w[0])+"</h1><p>"+E(w[1])+"</p>";
var big = (role==="mentor");
document.body.classList.toggle("big",big);
var nav=document.getElementById("steps");
if(role==="mentor"&&openModule){ nav.innerHTML=""; nav.style.display="none"; }
else{
nav.style.display="";
nav.innerHTML=STEPS[role].map(function(s,i){
var n=i+1,done=(role==="cand"&&n===1);
return '<button class="step '+(step===n?"on":"")+' '+(done?"done":"")+'" data-s="'+n+'">'+
'<span class="num">'+(done?"&#10003;":n)+'</span><span><b>'+E(s[0])+'</b><small>'+E(s[1])+
'</small></span></button>'}).join("");
[].forEach.call(document.querySelectorAll(".step"),function(b){
b.onclick=function(){step=+b.dataset.s;shell()}});
}
document.querySelector(".cols").style.gridTemplateColumns =
(role==="mentor"&&openModule) ? "1fr" : "";
document.getElementById("panel").innerHTML=
({cand:cand,mentor:mentor,isf:isf,co:co}[role])();
wire(); window.scrollTo(0,0);
}
function cand(){ return step===1?ships():step===2?send():step===3?redo():results() }
function ships(){
var h='<div class="card"><h2>Your ship</h2><p>Fill this in when you join. If you move to another '+
'ship during the programme, add it here as well.</p></div>';
me.ships.forEach(function(s,i){
h+='<div class="card"><div class="rowline" style="margin-bottom:14px"><h3>Ship '+(i+1)+
'</h3><span class="spacer"></span>'+(i>0?'<span class="tag t-none">Previous ship</span>':
'<span class="tag t-ok">On board</span>')+'</div><div class="grid2">'+
f("Name of ship",s.name)+f("Type of ship",s.type)+f("IMO number",s.imo)+
f("Owner or manager",s.owner)+f("Date you joined",s.joined,"date")+
f("Date you left (blank if still on board)",s.left,"date")+f("Port where you joined",s.port)+
'</div><div style="margin-top:10px"><label>Officers training you on board</label>'+
s.officers.map(function(o){return '<div class="grid2" style="margin-bottom:10px">'+
'<input value="'+E(o.n)+'" placeholder="Name"><input value="'+E(o.r)+'" placeholder="Rank">'+
'</div>'}).join("")+
'<button class="btn ghost sm" data-act="addoff">Add another officer</button></div></div>'});
h+='<div class="card" style="text-align:center"><p style="color:var(--ink2);margin-bottom:12px">'+
'Moved to a different ship?</p><button class="btn ghost" data-act="addship">Add another ship</button></div>'+
'<button class="btn" data-act="saved">Save my ship details</button>';
return h;
}
function f(l,v,t){return '<div class="field"><label>'+E(l)+'</label><input type="'+(t||"text")+
'" value="'+E(v)+'"></div>'}
function send(){
var cur=mod(sendMod),st=me.mods[sendMod];
var opts=MODULES.map(function(m){
var s=me.mods[m.id],lab="Module "+m.id+" — "+m.name;
if(s.state==="done")lab+="  (checked)";
if(s.state==="checking")lab+="  (with your mentor)";
return '<option value="'+m.id+'"'+(m.id===sendMod?" selected":"")+'>'+E(lab)+'</option>'}).join("");
var run=0,rows=FILES.map(function(fl,i){
var from=run+1;run+=fl.pages;
return '<div class="filerow"><span class="n">'+(i+1)+'</span><div style="flex:1">'+
'<b>'+E(fl.n)+'</b><div class="hint" style="margin:2px 0 0">'+fl.pages+' pages · '+fl.mb+
' MB · sheets '+from+'–'+run+'</div></div>'+
(i>0?'<button class="btn ghost sm" data-act="up" data-i="'+i+'">Move up</button>':'')+
(i<FILES.length-1?'<button class="btn ghost sm" data-act="down" data-i="'+i+'">Move down</button>':'')+
'<button class="btn ghost sm" data-act="rm" data-i="'+i+'">Remove</button></div>'}).join("");
return '<div class="card"><h2>The programme</h2>'+
'<p>Six modules, '+TOTAL_TASKS+' tasks in all. You send one module at a time.</p>'+
'<table style="margin-top:14px"><thead><tr><th>Module</th><th>Tasks</th><th>Where it is</th>'+
'<th>Mentor</th></tr></thead><tbody>'+
MODULES.map(function(m){var s=me.mods[m.id],t=STATE[s.state];
return '<tr><td><b>Module '+m.id+'</b><br><span style="color:var(--ink2);font-size:14px">'+
E(m.name)+'</span></td><td>'+(s.state==="doing"?s.answered+' of '+m.tasks:m.tasks)+
'</td><td><span class="tag '+t[1]+'">'+t[0]+'</span></td>'+
'<td style="color:var(--ink2)">'+(s.mentor?E(s.mentor):"&mdash;")+'</td></tr>'}).join("")+
'<tr><td><b>All six</b></td><td><b>'+TOTAL_TASKS+'</b></td><td colspan="2"></td></tr>'+
'</tbody></table></div>'+
'<div class="card"><h2>Send a module</h2>'+
'<div class="field" style="margin-top:14px"><label>Which module are you sending?</label>'+
'<select id="pick">'+opts+'</select></div>'+
'<label style="margin-top:6px">Your answer sheets</label>'+
'<p class="hint" style="margin:0 0 12px">You can attach up to <b>3 PDF files</b>. Attach them in '+
'the order your sheets are numbered. Up to 150 MB each, 300 MB in all.</p>'+
rows+
(FILES.length<3?'<button class="btn ghost" data-act="addfile">Attach another file</button>':
'<p class="hint">Three files attached — that is the maximum.</p>')+
'<div class="note" style="margin-top:14px"><b>'+run+' sheets in total.</b> '+
'Your answer index must point at sheets between 1 and '+run+'. '+
'Sheet numbers run straight through the files, so you number your paper 1 to '+run+' and nothing '+
'else to work out.</div>'+
'<p class="hint">Scanning in colour at 600 dpi makes files four or five times larger than they '+
'need to be. Greyscale at 300 dpi reads just as well.</p>'+
'<div style="margin-top:18px"><label>Answer index</label>'+
'<p class="hint" style="margin:0 0 10px">Which sheet each task is on. '+
st.answered+' of '+cur.tasks+' filled in.</p>'+
'<button class="btn ghost" data-act="index">Open the answer index</button></div>'+
'<div style="margin-top:20px"><label>Before you send</label>'+
tick("Every sheet is signed and stamped by the officer who supervised the work")+
tick("Every sheet carries my name, SSLAP number, mobile number, module and task number")+
tick("My sheets are in task order and the index matches them")+
tick("I scanned at 200–300 dpi and have read through the scan myself")+
tick("This is my own work")+
'</div><button class="btn" style="margin-top:16px" data-act="sent">Send to ISF</button>'+
'<p class="hint">ISF will allocate a mentor to check it. You will get an email when that happens.</p>'+
'</div>';
}
function tick(t){return '<div class="rowline" style="margin:8px 0"><input type="checkbox" checked '+
'style="width:20px;height:20px;flex:none"><span style="font-size:15px">'+E(t)+'</span></div>'}
function redo(){
var open=REDO.filter(function(r){return r.state==="todo"}).length;
var h='<div class="card"><h2>Tasks to redo</h2>'+
'<p>Your mentor has asked for these tasks to be done again. Do the task, then attach your new '+
'pages against it and send.</p><p style="margin-top:12px"><span class="tag '+
(open?"t-redo":"t-ok")+'">'+(open?open+" still to do":"Nothing outstanding")+'</span></p></div>';
if(!REDO.length) return h+'<div class="card"><div class="empty">Nothing has come back.</div></div>';
REDO.forEach(function(r){
var lab={todo:["To do","t-redo"],sent:["Sent back to your mentor","t-wait"],
ok:["Accepted","t-ok"]}[r.state];
h+='<div class="redoitem"><div class="rowline"><h3>Module '+r.mod+' · Task '+E(r.ref)+'</h3>'+
'<span class="spacer"></span><span class="tag '+lab[1]+'">'+lab[0]+'</span></div>'+
'<div class="said"><b>Your mentor says:</b> '+E(r.said)+'</div>';
if(r.state==="todo"){
h+='<label>Attach your new pages</label>'+
'<p class="hint" style="margin:0 0 10px">Up to 3 PDF files, usually just a few pages.</p>'+
(r.files.length?r.files.map(function(x){return '<div class="filerow"><span class="n">'+
'&#128196;</span><div style="flex:1"><b>'+E(x.n)+'</b><div class="hint">'+x.pages+
' pages</div></div></div>'}).join(""):'')+
'<button class="btn ghost sm" data-act="redofile" data-i="'+r.id+'">Attach a file</button>'+
'<div style="margin-top:14px"><button class="btn" data-act="redosend" data-i="'+r.id+
'">Send this back</button></div>';
} else if(r.state==="sent"){
h+=r.files.map(function(x){return '<div class="filerow"><span class="n">&#128196;</span>'+
'<div style="flex:1"><b>'+E(x.n)+'</b><div class="hint">'+x.pages+' pages · sent</div></div></div>'}).join("");
}
h+='</div>'});
return h;
}
function results(){
var marked=MODULES.filter(function(m){return me.mods[m.id].result});
var h='<div class="card"><h2>Your results</h2><p>What your mentor recorded for each module.</p></div>';
if(!marked.length)return h+'<div class="card"><div class="empty">Nothing checked yet.</div></div>';
marked.forEach(function(m){var r=me.mods[m.id].result;
h+='<div class="card"><div class="rowline" style="margin-bottom:10px"><h3>Module '+m.id+' — '+
E(m.name)+'</h3><span class="spacer"></span><span class="tag t-ok">Checked</span></div>'+
'<div class="kv"><b>How much you completed</b><span>'+E(r.band)+'</span></div>'+
'<div class="kv"><b>Interest in learning</b><span>'+r.interest+' out of 5</span></div>'+
'<div class="kv"><b>Mentor</b><span>'+E(me.mods[m.id].mentor)+'</span></div>'+
'<div class="kv"><b>What your mentor said</b><span>'+E(r.note)+'</span></div></div>'});
return h+'<div class="card"><div class="note">There is no overall score. Your mentor records how '+
'much of the module you completed and how you went about it.</div></div>';
}
function mentor(){
if(openModule) return checking();
if(step===2){
return '<div class="card"><h2>Finished</h2><p>Modules you have checked and signed.</p></div>'+
'<div class="card"><table><thead><tr><th>Candidate</th><th>Module</th><th>Completed</th>'+
'<th>Signed</th></tr></thead><tbody>'+FINISHED.map(function(x){
return '<tr><td><b>'+E(x.who)+'</b></td><td>Module '+x.mod+'</td><td>'+E(x.band)+
'</td><td>'+E(x.signed)+'</td></tr>'}).join("")+'</tbody></table></div>';
}
return '<div class="card"><h2>Modules to check</h2>'+
'<p>ISF allocates these to you. There is nothing to pick up or claim.</p></div>'+
'<div class="card"><table class="mentorlist"><tbody>'+
MYWORK.map(function(w){
var started=w.done>0;
return '<tr><td><b>'+E(w.who)+'</b><div style="color:var(--ink2);font-size:17px">Module '+w.mod+
' · '+w.tasks+' tasks'+(started?' · '+w.done+' checked':'')+'</div>'+
'<div style="color:var(--mute);font-size:16px">'+(started?'Started '+E(w.started):
'Not started yet')+'</div></td>'+
'<td style="text-align:right"><button class="btn" data-act="open" data-i="'+w.id+'">'+
(started?'Continue':'Start')+'</button></td></tr>'}).join("")+
'</tbody></table></div>';
}
function checking(){
var w=null;for(var i=0;i<MYWORK.length;i++)if(MYWORK[i].id===openModule)w=MYWORK[i];
var done=Object.keys(marks).length;
var nredo=Object.keys(marks).filter(function(k){return marks[k].v==="redo"}).length;
var list=DEMO.map(function(t){
var m=marks[t.ref]||{};
return '<div class="task '+(m.v==="ok"?"ok":m.v==="redo"?"redo":"")+'">'+
'<div class="tref">'+E(t.ref)+'</div><div class="tt">'+E(t.t)+'</div>'+
'<div class="sheetline">Candidate says: <b>sheet '+t.sheet+'</b></div>'+
'<button class="btn ghost sm" style="width:100%;margin-bottom:10px" data-act="goto" data-s="'+
t.sheet+'">Go to sheet '+t.sheet+'</button>'+
'<div class="btnpair">'+
'<button class="bigbtn yes '+(m.v==="ok"?"on":"")+'" data-act="mark" data-r="'+t.ref+
'" data-v="ok">&#10003; OK</button>'+
'<button class="bigbtn no '+(m.v==="redo"?"on":"")+'" data-act="mark" data-r="'+t.ref+
'" data-v="redo">&#10007; Redo</button></div>'+
(m.v==="redo"?'<div style="margin-top:12px"><label>What should he do again?</label>'+
'<textarea rows="3" placeholder="He cannot ask you, so the comment has to stand on its own.">'+
E(m.c||"")+'</textarea></div>':'')+
'<div style="margin-top:10px"><a href="#" data-act="whatcheck" style="font-size:15px">'+
'What to check &#9656;</a></div></div>'}).join("");
var sw=Math.round(520*zoom/100), sh=Math.round(sw*1.414);
return '<div class="card"><div class="rowline"><div><h2>'+E(w.who)+' — Module '+w.mod+'</h2>'+
'<p style="margin-top:4px">'+w.tasks+' tasks · '+w.sheets+' sheets · '+E(w.sslap)+'</p></div>'+
'<span class="spacer"></span><button class="btn ghost" data-act="back">Back to my list</button>'+
'</div><div class="progressline">'+done+' of '+DEMO.length+' checked'+
(nredo?' · '+nredo+' marked for redo':'')+'</div></div>'+
'<div class="check"><div><div class="viewer">'+
'<div class="vbar">'+
'<button class="vbtn" data-act="prev">&#9664; Previous</button>'+
'<span style="font-size:16px">Sheet <input id="shbox" value="'+sheetNo+'" style="width:72px;'+
'text-align:center;display:inline-block;padding:7px;font-size:16px"> of '+w.sheets+'</span>'+
'<button class="vbtn" data-act="next">Next &#9654;</button>'+
'<span class="vsep"></span>'+
'<button class="vbtn" data-act="zout">&minus;</button>'+
'<span class="zoomval">'+zoom+'%</span>'+
'<button class="vbtn" data-act="zin">+</button>'+
'<button class="vbtn" data-act="zfit">Reset</button>'+
'</div>'+
'<div class="vstage"><div class="sheet" style="width:'+sw+'px;height:'+sh+'px">'+
'<div>Sheet <b id="shno">'+sheetNo+'</b> of '+w.sheets+
'<div style="font-size:15px;color:#99a2aa;margin-top:8px">the candidate&#39;s handwritten '+
'answer sheets</div></div></div></div>'+
'</div>'+
'<div class="note" style="margin-top:12px;font-size:15px">Open the <b>Module '+w.mod+
' Check Document</b> to see what each task should contain. It opens in a new window and you can '+
'search it by task number.</div></div>'+
'<div class="tasklist">'+list+
'<div class="card" style="margin-top:6px"><div class="rowline">'+
'<button class="btn ghost" data-act="saveclose">Save and come back</button>'+
'<button class="btn ghost" data-act="sendredo">Send redo items now</button>'+
'<button class="btn" data-act="finish">Finish and sign</button></div>'+
'<p class="hint" style="margin-top:12px">Everything you tick is saved as you go. You can stop '+
'at any time and carry on later from where you left off.</p>'+
'<div style="margin-top:14px"><button class="btn ghost sm" data-act="askisf">Ask ISF about '+
'this module</button></div></div></div></div>';
}
function isf(){
if(step===2){
return '<div class="card"><h2>All candidates</h2><p>Everyone on the programme, across every '+
'company.</p></div><div class="card"><table><thead><tr><th>Candidate</th><th>Company</th>'+
'<th>Modules checked</th><th>Mentors used</th></tr></thead><tbody>'+
'<tr><td><b>Arjun Mehta</b><br><span style="color:var(--ink2);font-size:14px">SSLAP/2026/0418'+
'</span></td><td>Meridian Lines</td><td>2 of 6</td><td>R. Venkatesan, S. Bhattacharya</td></tr>'+
'<tr><td><b>Priya Nair</b><br><span style="color:var(--ink2);font-size:14px">SSLAP/2026/0421'+
'</span></td><td>Meridian Lines</td><td>1 of 6</td><td>S. Bhattacharya</td></tr>'+
'<tr><td><b>Imran Shaikh</b><br><span style="color:var(--ink2);font-size:14px">SSLAP/2026/0433'+
'</span></td><td>Coastal Carriers</td><td>0 of 6</td><td>none yet</td></tr>'+
'</tbody></table></div>';
}
if(step===3){
return '<div class="card"><h2>Create a login</h2>'+
'<p>Nobody signs themselves up. You create every account.</p>'+
'<div class="field" style="margin-top:14px"><label>What are you creating?</label>'+
'<select><option>Candidate</option><option>Mentor</option><option>Company</option></select></div>'+
'<div class="grid2">'+f("Full name","")+f("Email","","email")+f("Mobile number","")+
f("CDC number","")+'</div>'+
'<div class="field"><label>Sea time required</label><select><option>6 months</option>'+
'<option>9 months</option></select></div>'+
'<button class="btn" data-act="made">Create the login</button>'+
'<p class="hint">They get an email with a link to set their own password.</p></div>';
}
return '<div class="card"><h2>Waiting to be allocated</h2>'+
'<p>Every module a candidate sends comes here first. Choose which mentor checks it. '+
'Nothing is allocated automatically.</p></div>'+
(WAITING.some(function(x){return x.days>2})?
'<div class="warn"><b>One module has been waiting more than 48 hours.</b> '+
'The candidate cannot chase this — allocate it today.</div><div style="height:16px"></div>':'')+
WAITING.map(function(x){
var fit=MENTORS.filter(function(m){return m.mods.indexOf(x.mod)>-1});
return '<div class="card"><div class="rowline" style="margin-bottom:10px">'+
'<div><h3>'+E(x.who)+' — Module '+x.mod+'</h3>'+
'<p style="margin-top:3px">'+E(x.sslap)+' · '+E(x.co)+' · sent '+E(x.sent)+'</p></div>'+
'<span class="spacer"></span><span class="tag '+(x.days>2?"t-redo":"t-wait")+'">'+
x.days+' day'+(x.days===1?"":"s")+' waiting</span></div>'+
'<p class="hint" style="margin-bottom:12px">Earlier modules for this candidate were checked by: '+
E(x.prev)+'</p>'+
'<table><thead><tr><th>Mentor</th><th>Approved for</th><th>Checking now</th>'+
'<th>Average turnaround</th><th></th></tr></thead><tbody>'+
fit.map(function(m){
return '<tr><td><b>'+E(m.name)+'</b><br><span style="color:var(--ink2);font-size:13px">'+
E(m.rank)+'</span></td><td>'+m.mods.join(", ")+'</td><td>'+m.load+' module'+(m.load===1?'':'s')+'</td>'+
'<td>'+m.turn+' days</td><td style="text-align:right">'+
'<button class="btn sm" data-act="alloc" data-w="'+x.id+'" data-m="'+E(m.name)+
'">Allocate</button></td></tr>'}).join("")+
'</tbody></table></div>'}).join("");
}
function co(){
if(step===2){
return '<div class="card"><h2>Their results</h2><p>You see what the mentor recorded, and you add '+
"the company's own comment.</p></div>"+
'<div class="card"><div class="rowline" style="margin-bottom:10px"><h3>Arjun Mehta — Module 1'+
'</h3><span class="spacer"></span><span class="tag t-ok">Checked</span></div>'+
'<div class="kv"><b>How much completed</b><span>More than 90%</span></div>'+
'<div class="kv"><b>Interest in learning</b><span>5 out of 5</span></div>'+
'<div class="kv"><b>Mentor</b><span>R. Venkatesan</span></div>'+
'<div class="kv"><b>Mentor comment</b><span>Good work. Own readings throughout.</span></div>'+
'<div class="field" style="margin-top:16px"><label>Your comment as the company</label>'+
'<textarea rows="2" placeholder="Your comment"></textarea></div>'+
'<button class="btn" data-act="cosign">Save my comment</button></div>';
}
return '<div class="card"><h2>Our candidates</h2><p>Only your own company'+"'"+'s candidates appear '+
'here.</p></div><div class="card"><table><thead><tr><th>Candidate</th><th>Ship</th>'+
'<th>Sea time</th><th>Modules checked</th></tr></thead><tbody>'+
'<tr><td><b>Arjun Mehta</b><br><span style="color:var(--ink2);font-size:14px">SSLAP/2026/0418'+
'</span></td><td>ISF Meridian</td><td>7 months</td><td>2 of 6</td></tr>'+
'<tr><td><b>Priya Nair</b><br><span style="color:var(--ink2);font-size:14px">SSLAP/2026/0421'+
'</span></td><td>ISF Kavaratti</td><td>5 months</td><td>1 of 6</td></tr>'+
'</tbody></table></div>';
}
var SAY={saved:"Ship details saved.",sent:"Sent to ISF. You will get an email when a mentor is allocated.",
addship:"A second ship has been added below.",addoff:"Another officer row added.",
addfile:"File attached. Sheet numbers have been recalculated.",
index:"The answer index opens here.",redofile:"File attached to this task.",
redosend:"Sent back to your mentor.",made:"Login created. An email has gone out.",
cosign:"Your comment has been saved.",saveclose:"Saved. You can carry on later from here.",
sendredo:"The redo items have gone to the candidate. The module stays with you.",
finish:"The evaluation sheet opens here. Once signed it goes to the candidate, ISF and the company.",
askisf:"Your question has gone to the ISF office with this module attached.",
whatcheck:"The Module Check Document opens in a new window, at this task."};
function wire(){
[].forEach.call(document.querySelectorAll("[data-act]"),function(b){
b.onclick=function(ev){
ev.preventDefault();
var a=b.dataset.act;
if(a==="addship"){me.ships.push({name:"",type:"",imo:"",owner:"",joined:"",left:"",port:"",
officers:[{n:"",r:""}]});shell();return}
if(a==="addoff"){me.ships[0].officers.push({n:"",r:""});shell();return}
if(a==="addfile"){if(FILES.length<3){FILES.push({n:"scan_part"+(FILES.length+1)+".pdf",
pages:20+Math.round(Math.random()*80),mb:10+Math.round(Math.random()*30)})}shell();flash(SAY[a]);return}
if(a==="rm"){FILES.splice(+b.dataset.i,1);shell();flash("File removed. Sheet numbers recalculated.");return}
if(a==="up"){var i=+b.dataset.i;var t=FILES[i];FILES[i]=FILES[i-1];FILES[i-1]=t;shell();
flash("Order changed. Sheet numbers recalculated.");return}
if(a==="down"){var j=+b.dataset.i;var u=FILES[j];FILES[j]=FILES[j+1];FILES[j+1]=u;shell();
flash("Order changed. Sheet numbers recalculated.");return}
if(a==="redofile"){var id=+b.dataset.i;REDO.forEach(function(r){if(r.id===id)
r.files.push({n:"redo_"+r.ref.split(".").join("")+".pdf",pages:2+Math.round(Math.random()*4)})});
shell();flash(SAY[a]);return}
if(a==="redosend"){var id2=+b.dataset.i;REDO.forEach(function(r){if(r.id===id2){
if(!r.files.length)r.files.push({n:"redo_"+r.ref.split(".").join("")+".pdf",pages:3});
r.state="sent"}});shell();flash(SAY[a]);return}
if(a==="alloc"){var wid=b.dataset.w,mn=b.dataset.m;
for(var k=0;k<WAITING.length;k++)if(WAITING[k].id===wid){WAITING.splice(k,1);break}
shell();flash("Allocated to "+mn+". An email has gone to them.");return}
if(a==="open"){openModule=b.dataset.i;shell();return}
if(a==="back"){openModule=null;marks={};sheetNo=1;zoom=100;shell();return}
if(a==="mark"){var r=b.dataset.r,v=b.dataset.v;
if(marks[r]&&marks[r].v===v){delete marks[r]}else{marks[r]={v:v,c:(marks[r]||{}).c||""}}
shell();return}
if(a==="goto"||a==="prev"||a==="next"){
var box=document.getElementById("shbox");
var n=a==="goto"?+b.dataset.s:(+((box&&box.value))||sheetNo)+(a==="next"?1:-1);
if(n<1)n=1; sheetNo=n; shell(); return}
if(a==="zin"){zoom=Math.min(300,zoom+25);shell();return}
if(a==="zout"){zoom=Math.max(50,zoom-25);shell();return}
if(a==="zfit"){zoom=100;shell();return}
flash(SAY[a]||"Saved.");
}});
var pk=document.getElementById("pick");
if(pk)pk.onchange=function(){sendMod=+pk.value;shell()};
var sb=document.getElementById("shbox");
if(sb)sb.onchange=function(){var n=+sb.value||1;sheetNo=n<1?1:n;shell()};
}
function flash(m){var d=document.createElement("div");d.textContent=m;
d.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#13202b;"+
"color:#fff;padding:14px 26px;border-radius:999px;font-size:17px;z-index:99;max-width:90%;"+
"text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)";
document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
shell();
</script>
</body>
</html>
