<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSLA Portal</title>
<style>
:root{
--blue:#0b6ec4; --blue-dk:#08528f; --ink:#13202b; --ink2:#53606b; --mute:#8b959d;
--line:#dfe5ea; --bg:#f4f7f9; --card:#fff;
--ok:#0d7a3e; --okbg:#e7f5ec; --wait:#9a6400; --waitbg:#fdf3e0; --todo:#b03a20; --todobg:#fdecE7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:25px;font-weight:650}
h2{font-size:19px;font-weight:650}
h3{font-size:16px;font-weight:650}
p{margin:0}
a{color:var(--blue)}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
header{background:var(--card);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 0}
.brand{font-weight:700;font-size:18px}
.brand span{font-weight:400;color:var(--ink2);font-size:14px;margin-left:8px}
.roles{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.roles button{border:1px solid var(--line);background:#fff;color:var(--ink2);
padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.roles button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.who{background:var(--card);border-bottom:1px solid var(--line);padding:18px 0}
.who p{color:var(--ink2);font-size:15px;margin-top:4px}
.cols{display:grid;grid-template-columns:270px 1fr;gap:26px;padding:26px 0 60px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;font:inherit}
.step:hover{border-color:#b9c6d1}
.step.on{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);color:var(--ink2);
display:grid;place-items:center;font-size:14px;font-weight:650}
.step.on .num{background:var(--blue);color:#fff}
.step.done .num{background:var(--okbg);color:var(--ok)}
.step b{display:block;font-weight:600;font-size:15px}
.step small{color:var(--ink2);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
.card>h2+p,.card>h3+p{color:var(--ink2);margin-top:6px;font-size:15px}
.lead{color:var(--ink2);font-size:15px;margin-bottom:18px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.t-ok{background:var(--okbg);color:var(--ok)} .t-wait{background:var(--waitbg);color:var(--wait)}
.t-todo{background:var(--todobg);color:var(--todo)} .t-none{background:var(--bg);color:var(--ink2)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 20px;
font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--blue-dk)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd9f2;border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.hint{font-size:13px;color:var(--ink2);margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--ink2);font-weight:600;padding:0 10px 8px 0}
td{padding:11px 10px 11px 0;border-top:1px solid var(--line);vertical-align:top}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue)}
.bar i.full{background:var(--ok)}
.note{background:#eef5fb;border:1px solid #cfe2f3;border-radius:10px;padding:14px 16px;font-size:15px}
.rowline{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.ship{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.ship h3{font-size:15px}
.empty{text-align:center;color:var(--ink2);padding:34px 10px;font-size:15px}
.redo{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.redo .said{background:var(--bg);border-radius:8px;padding:11px 13px;margin:9px 0;font-size:15px}
ol.plain{margin:10px 0 0;padding-left:20px;color:var(--ink2);font-size:15px}
ol.plain li{margin-bottom:5px}
.kv{display:flex;gap:10px;font-size:15px;padding:7px 0;border-top:1px solid var(--line)}
.kv b{font-weight:600;min-width:170px;color:var(--ink2)}
</style>
</head>
<body>
<header><div class="wrap hrow">
<div class="brand">SSLA Portal<span>ISF Maritime and Offshore Institute</span></div>
<div class="roles" id="roles"></div>
</div></header>
<div class="who"><div class="wrap" id="who"></div></div>
<div class="wrap cols">
<nav class="steps" id="steps"></nav>
<main id="panel"></main>
</div>
<script>
var MODULES=[
{id:1,name:"Safety, Emergency and Shipboard Familiarisation",tasks:271},
{id:2,name:"Machinery Operation and Watchkeeping",tasks:300},
{id:3,name:"Machinery and Ship Construction",tasks:340},
{id:4,name:"Machinery and Electrical Maintenance",tasks:349},
{id:5,name:"Troubleshooting, Automation and Control",tasks:182},
{id:6,name:"Management, Statutory and Environmental",tasks:96}
];
var me={
name:"Arjun Mehta", sslap:"SSLAP/2026/0418", cdc:"MUM 123456", company:"Meridian Lines",
mentor:"R. Venkatesan",
ships:[{name:"ISF Meridian",type:"Container",imo:"9512345",owner:"Meridian Lines",
joined:"2026-04-12",left:"",port:"Singapore",
officers:[{n:"K. Subramanian",r:"Second Engineer"},{n:"A. Dsouza",r:"Third Engineer"}]}],
mods:{
1:{state:"done", sent:"2026-05-02", result:{interest:5,band:"More than 90%",
note:"Good work. Your own readings throughout, and the escape routes were walked properly."}},
2:{state:"done", sent:"2026-07-11", result:{interest:4,band:"71% to 90%",
note:"Sound. Bunkering figures were taken from a transfer you attended, which is what we want."}},
3:{state:"marking", sent:"2026-10-18", result:null},
4:{state:"doing", sent:"", result:null},
5:{state:"not", sent:"", result:null},
6:{state:"not", sent:"", result:null}
}
};
var CANT=[
{mod:4,ref:"A.11.3",why:"No homogeniser fitted on this ship."},
{mod:4,ref:"A.22.2",why:"Gas welding not carried on board. Electric welding done."}
];
var REDO=[
{id:1,mod:3,page:73,state:"todo",
said:"The scavenge port timing is from the manual drawing, not your own engine. Measure it on your unit at the next overhaul and give the figures with the date.",by:"R. Venkatesan",on:"22 Oct 2026",did:""},
{id:2,mod:3,page:41,state:"doing",
said:"The crosshead lubrication answer is general. Give the oil pressure for YOUR engine, with the manual section and page, and the pressure you read on the gauge.",by:"R. Venkatesan",on:"22 Oct 2026",
did:"Gauge pressure read on the 0400-0800 watch on 25 Oct. Still to get the manual page."},
{id:3,mod:3,page:104,state:"done",
said:"No signature from the officer against the auxiliary engine entry.",by:"R. Venkatesan",on:"22 Oct 2026",
did:"Signed by the Second Engineer on 23 Oct."}
];
var WAITING=[
{who:"Arjun Mehta",ship:"ISF Meridian",mod:3,sent:"18 Oct 2026",days:11},
{who:"Priya Nair",ship:"ISF Kavaratti",mod:2,sent:"24 Oct 2026",days:5},
{who:"Imran Shaikh",ship:"Meridian Trader",mod:1,sent:"26 Oct 2026",days:3}
];
var PEOPLE=[
{name:"Arjun Mehta",kind:"Candidate",org:"Meridian Lines",id:"SSLAP/2026/0418"},
{name:"Priya Nair",kind:"Candidate",org:"Meridian Lines",id:"SSLAP/2026/0421"},
{name:"Imran Shaikh",kind:"Candidate",org:"Coastal Carriers",id:"SSLAP/2026/0433"},
{name:"R. Venkatesan",kind:"Mentor",org:"IMOI",id:"MEN/004"},
{name:"S. Bhattacharya",kind:"Mentor",org:"IMOI",id:"MEN/007"},
{name:"Meridian Lines",kind:"Company",org:"-",id:"CO/011"}
];
var E=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var mod=function(i){for(var k=0;k<MODULES.length;k++)if(MODULES[k].id===i)return MODULES[k];};
var STATE={done:["Marked","t-ok"],marking:["With your mentor","t-wait"],
doing:["You are on this one","t-none"],not:["Not started","t-none"]};
var role="cand", step=1;
var ROLES=[["cand","Candidate"],["mentor","Mentor"],["company","Company"],["admin","ISF admin"]];
var STEPS={
cand:[["Your ship","Fill this in first"],
["Send a module","Pick the module and upload it"],
["Tasks to do again","What your mentor sent back"],
["Your results","What you scored and why"]],
mentor:[["Modules waiting","Candidates waiting on you"],
["Mark a module","Fill the evaluation sheet"],
["Sent back","Waiting for the candidate"],
["Finished","Modules you have closed"]],
company:[["Your candidates","Who is where"],
["Their results","Marked modules"]],
admin:[["Create a login","Candidate, mentor or company"],
["Everyone on the system","Accounts that exist"]]
};
function shell(){
document.getElementById("roles").innerHTML=ROLES.map(function(r){
return '<button data-r="'+r[0]+'" class="'+(role===r[0]?"on":"")+'">'+r[1]+'</button>';}).join("");
[].forEach.call(document.querySelectorAll("#roles button"),function(b){
b.onclick=function(){role=b.dataset.r;step=1;shell();};});
var w={cand:["Arjun Mehta","Candidate - "+me.sslap+" - mentor "+me.mentor],
mentor:["R. Venkatesan","Mentor, IMOI - 3 modules waiting for you"],
company:["Meridian Lines","Training officer - 2 candidates at sea"],
admin:["ISF administrator","You create and manage every login"]}[role];
document.getElementById("who").innerHTML="<h1>"+E(w[0])+"</h1><p>"+E(w[1])+"</p>";
var list=STEPS[role];
document.getElementById("steps").innerHTML=list.map(function(s,i){
var n=i+1, done=(role==="cand"&&n===1);
return '<button class="step '+(step===n?"on":"")+' '+(done?"done":"")+'" data-s="'+n+'">'+
'<span class="num">'+(done?"&#10003;":n)+'</span><span><b>'+E(s[0])+'</b><small>'+E(s[1])+'</small></span></button>';
}).join("");
[].forEach.call(document.querySelectorAll(".step"),function(b){
b.onclick=function(){step=+b.dataset.s;shell();};});
document.getElementById("panel").innerHTML=({cand:cand,mentor:mentor,company:company,admin:admin}[role])();
wire();
window.scrollTo(0,0);
}
function cand(){
if(step===1) return ships();
if(step===2) return send();
if(step===3) return redo();
return results();
}
function ships(){
var h='<div class="card"><h2>Your ship</h2>'+
'<p>Fill this in when you join. If you move to another ship during the programme, add it here too '+
'— your sea time adds up across both.</p></div>';
me.ships.forEach(function(s,i){
h+='<div class="card"><div class="rowline" style="margin-bottom:14px">'+
'<h3>Ship '+(i+1)+(i===0?' — the one you are on now':'')+'</h3><span class="spacer"></span>'+
(i>0?'<span class="tag t-none">Previous ship</span>':'<span class="tag t-ok">On board</span>')+'</div>'+
'<div class="grid2">'+
f("Name of ship",s.name)+f("Type of ship",s.type)+
f("IMO number",s.imo)+f("Owner or manager",s.owner)+
f("Date you joined",s.joined,"date")+f("Date you left (leave blank if still on board)",s.left,"date")+
f("Port where you joined",s.port)+
'</div>'+
'<div style="margin-top:16px"><label>Officers training you on board</label>'+
'<p class="hint" style="margin:0 0 10px">Add up to five. They are the people who sign your book.</p>'+
s.officers.map(function(o){return '<div class="grid2" style="margin-bottom:10px">'+
'<input value="'+E(o.n)+'" placeholder="Name"><input value="'+E(o.r)+'" placeholder="Rank">'+
'</div>';}).join("")+
'<button class="btn ghost" data-act="addoff">Add another officer</button></div></div>';
});
h+='<div class="card" style="text-align:center">'+
'<p class="lead" style="margin:0 0 14px">Moved to a different ship?</p>'+
'<button class="btn ghost" data-act="addship">Add another ship</button></div>'+
'<button class="btn" data-act="saved">Save my ship details</button>';
return h;
}
function f(label,val,type){
return '<div class="field"><label>'+E(label)+'</label>'+
'<input type="'+(type||"text")+'" value="'+E(val)+'"></div>';
}
function send(){
var opts=MODULES.map(function(m){
var s=me.mods[m.id], lab="Module "+m.id+" — "+m.name;
if(s.state==="done") lab+="  (already marked)";
if(s.state==="marking") lab+="  (with your mentor)";
return '<option value="'+m.id+'"'+(m.id===4?" selected":"")+'>'+E(lab)+'</option>';
}).join("");
return '<div class="card"><h2>Send a module to your mentor</h2>'+
'<p>Send one module at a time, in order. Your mentor marks it and releases the next one.</p>'+
'<div class="field" style="margin-top:18px"><label>Which module are you sending?</label>'+
'<select id="pick">'+opts+'</select></div>'+
'<div class="note" style="margin:16px 0"><b>Before you scan it</b>'+
'<ol class="plain"><li>Every task is answered in your own handwriting.</li>'+
'<li>Your training officer has checked and signed it.</li>'+
'<li>Any sketches are on separate sheets, marked with the task number.</li>'+
'<li>Scan the whole book in order, as one PDF.</li></ol></div>'+
'<div class="field"><label>Your scanned module</label>'+
'<input type="file"><p class="hint">One PDF. If it is too large, split it in two and send both.</p></div>'+
'<button class="btn" data-act="sent">Send to my mentor</button></div>'+
'<div class="card"><h3>Anything you could not do?</h3>'+
'<p>If a task cannot be done on your ship — the equipment is not fitted, or the job did not come up '+
'during your time on board — list it here with the reason. Your mentor needs to know, otherwise it '+
'looks like you simply left it out.</p>'+
CANT.filter(function(c){return c.mod===4;}).map(function(c){
return '<div class="grid2" style="margin-top:12px"><input value="'+E(c.ref)+'" placeholder="Task number">'+
'<input value="'+E(c.why)+'" placeholder="Why you could not do it"></div>';}).join("")+
'<div class="grid2" style="margin-top:12px"><input placeholder="Task number, for example A.6.4">'+
'<input placeholder="Why you could not do it"></div>'+
'<div style="margin-top:12px"><button class="btn ghost" data-act="addcant">Add another</button></div></div>'+
'<div class="card"><h3>What you have sent so far</h3>'+
'<p>How much you completed is decided by your mentor when they read your book — it is not counted '+
'automatically. Until a module is marked, it just shows where it is.</p>'+
'<table style="margin-top:14px"><thead><tr>'+
'<th>Module</th><th>Tasks in the book</th><th>Sent on</th><th>Where it is</th>'+
'<th>How much you completed</th></tr></thead><tbody>'+
MODULES.map(function(m){var s=me.mods[m.id],st=STATE[s.state];
return '<tr><td><b>Module '+m.id+'</b><br><span style="color:var(--ink2);font-size:14px">'+E(m.name)+'</span></td>'+
'<td style="color:var(--ink2)">'+m.tasks+'</td>'+
'<td>'+(s.sent?E(s.sent):"&mdash;")+'</td><td><span class="tag '+st[1]+'">'+st[0]+'</span></td>'+
'<td>'+(s.result?'<b>'+E(s.result.band)+'</b>':'<span style="color:var(--mute)">Not marked yet</span>')+
'</td></tr>';
}).join("")+'</tbody></table></div>';
}
function redo(){
var open=REDO.filter(function(r){return r.state!=="done";}).length;
var h='<div class="card"><h2>Tasks to do again</h2>'+
'<p>When your mentor wants something put right, it appears here. Do it on board, get the officer to '+
'sign it, then send those pages again — not the whole book.</p>'+
'<p style="margin-top:12px"><span class="tag '+(open?"t-todo":"t-ok")+'">'+
(open?open+" still to do":"Nothing outstanding")+'</span></p></div>';
if(!REDO.length) return h+'<div class="card"><div class="empty">Nothing has come back.</div></div>';
REDO.forEach(function(r){
var lab={todo:["Still to do","t-todo"],doing:["You are on it","t-wait"],done:["Accepted","t-ok"]}[r.state];
h+='<div class="redo"><div class="rowline">'+
'<h3>Module '+r.mod+', page '+r.page+'</h3><span class="spacer"></span>'+
'<span class="tag '+lab[1]+'">'+lab[0]+'</span></div>'+
'<p class="hint" style="margin-top:4px">From '+E(r.by)+', '+E(r.on)+'</p>'+
'<div class="said">'+E(r.said)+'</div>'+
'<label>What you did about it</label>'+
(r.state==="done"
? '<p style="color:var(--ink2);font-size:15px">'+E(r.did)+'</p>'
: '<textarea rows="2" placeholder="What you did, when, and who was with you.">'+E(r.did)+'</textarea>'+
'<div style="margin-top:10px"><button class="btn" data-act="fixed">Done — officer has signed it</button></div>')+
'</div>';
});
return h;
}
function results(){
var marked=MODULES.filter(function(m){return me.mods[m.id].result;});
var h='<div class="card"><h2>Your results</h2>'+
'<p>What your mentor and your company said about each module you have sent.</p></div>';
if(!marked.length) return h+'<div class="card"><div class="empty">Nothing marked yet.</div></div>';
marked.forEach(function(m){
var r=me.mods[m.id].result;
h+='<div class="card"><div class="rowline" style="margin-bottom:12px">'+
'<h3>Module '+m.id+' — '+E(m.name)+'</h3><span class="spacer"></span>'+
'<span class="tag t-ok">Marked</span></div>'+
'<div class="kv"><b>How much you completed</b><span>'+E(r.band)+'</span></div>'+
'<div class="kv"><b>Interest in learning</b><span>'+r.interest+' out of 5</span></div>'+
'<div class="kv"><b>What your mentor said</b><span>'+E(r.note)+'</span></div></div>';
});
return h+'<div class="card"><div class="note">There is no overall mark for a module, and no mark per '+
'task. Your mentor reads your book and records how much of it you completed and how you went about '+
'it. Nothing is counted automatically.</div></div>';
}
function mentor(){
if(step===1){
return '<div class="card"><h2>Modules waiting for you</h2>'+
'<p>Oldest first. A candidate at sea is waiting on each one before they can start the next module.</p></div>'+
'<div class="card"><table><thead><tr><th>Candidate</th><th>Ship</th><th>Module</th>'+
'<th>Sent</th><th>Waiting</th><th></th></tr></thead><tbody>'+
WAITING.map(function(w){
return '<tr><td><b>'+E(w.who)+'</b></td><td>'+E(w.ship)+'</td><td>Module '+w.mod+'</td>'+
'<td>'+E(w.sent)+'</td><td>'+(w.days>7?'<span class="tag t-todo">'+w.days+' days</span>'
:'<span style="color:var(--ink2)">'+w.days+' days</span>')+'</td>'+
'<td style="text-align:right"><button class="btn" data-act="open">Open</button></td></tr>';
}).join("")+'</tbody></table></div>';
}
if(step===2){
return '<div class="card"><h2>Mark a module</h2>'+
'<p>Arjun Mehta — Module 3, Machinery and Ship Construction. Sent 18 Oct 2026.</p></div>'+
'<div class="card"><div class="note" style="margin-bottom:18px"><b>You decide how much was completed.</b>'+
'<p style="margin-top:6px">Nothing counts the tasks for you — the book is handwritten and scanned. '+
'Read through it and judge which band it falls in, the same way you would with the paper sheet.</p></div>'+
'<div class="field"><label>How much of the module was completed</label>'+
'<select><option>More than 90%</option><option selected>71% to 90%</option>'+
'<option>51% to 70%</option><option>41% to 50%</option><option>Less than 40%</option></select></div>'+
'<div class="field"><label>Tasks the candidate said they could not do</label>'+
'<div style="border:1px solid var(--line);border-radius:8px;padding:12px">'+
CANT.map(function(c){return '<div style="padding:5px 0;font-size:15px">'+
'<b>'+E(c.ref)+'</b> &mdash; '+E(c.why)+'</div>';}).join("")+
'</div><p class="hint">Check these against the ship before you hold them against the candidate.</p></div>'+
'<div class="field"><label>Interest shown in learning</label>'+
'<select><option>5 — very high</option><option selected>4 — high</option><option>3 — fair</option>'+
'<option>2 — low</option><option>1 — very low</option></select></div>'+
'<div class="field"><label>Your comments</label>'+
'<textarea rows="3" placeholder="What was done well, and what needs to improve."></textarea></div>'+
'<div class="rowline"><button class="btn" data-act="marked">Save and send to the candidate</button>'+
'<button class="btn ghost" data-act="sendback">Send something back to be done again</button></div></div>'+
'<div class="card"><h3>Sections of this module</h3>'+
'<p>Comment on each section. There is no mark per task — task sets differ between companies.</p>'+
["A — Ship construction","B — Stability","C — Machinery systems","D — Drawings and plans"].map(function(s){
return '<div class="field" style="margin-top:14px"><label>'+E(s)+'</label>'+
'<textarea rows="2" placeholder="Comment"></textarea></div>';}).join("")+'</div>';
}
if(step===3){
return '<div class="card"><h2>Sent back</h2><p>Things you asked candidates to do again.</p></div>'+
'<div class="card"><table><thead><tr><th>Candidate</th><th>Module</th><th>Page</th>'+
'<th>Where it is</th></tr></thead><tbody>'+
REDO.map(function(r){
var lab={todo:["With the candidate","t-todo"],doing:["Being done","t-wait"],done:["Accepted","t-ok"]}[r.state];
return '<tr><td>Arjun Mehta</td><td>Module '+r.mod+'</td><td>'+r.page+'</td>'+
'<td><span class="tag '+lab[1]+'">'+lab[0]+'</span></td></tr>';}).join("")+
'</tbody></table></div>';
}
return '<div class="card"><h2>Finished</h2><p>Modules you have marked and closed.</p></div>'+
'<div class="card"><table><thead><tr><th>Candidate</th><th>Module</th><th>Completed</th>'+
'<th>Closed</th></tr></thead><tbody>'+
'<tr><td>Arjun Mehta</td><td>Module 1</td><td>More than 90%</td><td>05 May 2026</td></tr>'+
'<tr><td>Arjun Mehta</td><td>Module 2</td><td>71% to 90%</td><td>14 Jul 2026</td></tr>'+
'</tbody></table></div>';
}
function company(){
if(step===1){
return '<div class="card"><h2>Your candidates</h2>'+
'<p>Everyone from your company on the programme, and how far along they are.</p></div>'+
'<div class="card"><table><thead><tr><th>Name</th><th>Ship</th><th>Sea time</th>'+
'<th>Modules marked</th></tr></thead><tbody>'+
'<tr><td><b>Arjun Mehta</b><br><span style="color:var(--ink2);font-size:14px">SSLAP/2026/0418</span></td>'+
'<td>ISF Meridian</td><td>6 months</td><td>2 of 6<div class="bar"><i style="width:33%"></i></div></td></tr>'+
'<tr><td><b>Priya Nair</b><br><span style="color:var(--ink2);font-size:14px">SSLAP/2026/0421</span></td>'+
'<td>ISF Kavaratti</td><td>4 months</td><td>1 of 6<div class="bar"><i style="width:17%"></i></div></td></tr>'+
'</tbody></table></div>';
}
return '<div class="card"><h2>Their results</h2>'+
'<p>You see the same sheet the mentor filled in, and you add your own comment as the company.</p></div>'+
'<div class="card"><div class="rowline" style="margin-bottom:12px">'+
'<h3>Arjun Mehta — Module 1</h3><span class="spacer"></span><span class="tag t-ok">Marked</span></div>'+
'<div class="kv"><b>How much completed</b><span>More than 90%</span></div>'+
'<div class="kv"><b>Interest in learning</b><span>5 out of 5</span></div>'+
'<div class="kv"><b>Mentor comment</b><span>Good work. Own readings throughout.</span></div>'+
'<div class="field" style="margin-top:16px"><label>Your comment as the company</label>'+
'<textarea rows="2" placeholder="Your comment"></textarea></div>'+
'<button class="btn" data-act="cosign">Save my comment</button></div>';
}
function admin(){
if(step===1){
return '<div class="card"><h2>Create a login</h2>'+
'<p>Candidates do not sign themselves up. You create the account and they fill in their ship details '+
'when they first log in.</p>'+
'<div class="field" style="margin-top:18px"><label>What are you creating?</label>'+
'<select id="kind"><option>Candidate</option><option>Mentor</option><option>Company</option></select></div>'+
'<div class="grid2">'+f("Full name","")+f("Email","","email")+
f("CDC number","")+f("Company","")+'</div>'+
'<div class="field"><label>Sea time required</label>'+
'<select><option>6 months</option><option>9 months</option></select></div>'+
'<button class="btn" data-act="made">Create the login</button>'+
'<p class="hint" style="margin-top:10px">They get an email with a link to set their own password.</p></div>';
}
return '<div class="card"><h2>Everyone on the system</h2>'+
'<p>Every account ISF has created.</p></div>'+
'<div class="card"><table><thead><tr><th>Name</th><th>Kind</th><th>Company</th>'+
'<th>Reference</th></tr></thead><tbody>'+
PEOPLE.map(function(p){
return '<tr><td><b>'+E(p.name)+'</b></td><td>'+E(p.kind)+'</td><td>'+E(p.org)+'</td>'+
'<td style="color:var(--ink2)">'+E(p.id)+'</td></tr>';}).join("")+
'</tbody></table></div>';
}
var SAY={saved:"Ship details saved.",sent:"Module sent to your mentor.",
fixed:"Marked as done. Send those pages again from step 2.",
marked:"Saved and sent to the candidate.",sendback:"Added to the candidate's list.",
open:"Opening the evaluation sheet — see step 2.",cosign:"Your comment has been saved.",
made:"Login created. An email has gone out.",addcant:"Another row added.",
addship:"A second ship has been added below.",addoff:"Another officer row added."};
function wire(){
[].forEach.call(document.querySelectorAll("[data-act]"),function(b){
b.onclick=function(){
var a=b.dataset.act;
if(a==="addship"){
me.ships.push({name:"",type:"",imo:"",owner:"",joined:"",left:"",port:"",
officers:[{n:"",r:""}]});
shell(); return;
}
if(a==="addoff"){me.ships[0].officers.push({n:"",r:""});shell();return;}
if(a==="fixed"){var t=REDO.filter(function(r){return r.state!=="done";})[0];
if(t){t.state="done";t.did=t.did||"Done on board and signed by the officer.";}shell();}
if(a==="open"){step=2;shell();}
flash(SAY[a]||"Saved.");
};
});
}
function flash(msg){
var d=document.createElement("div");
d.textContent=msg;
d.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#13202b;"+
"color:#fff;padding:12px 22px;border-radius:999px;font-size:15px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.25)";
document.body.appendChild(d);
setTimeout(function(){d.remove();},2200);
}
shell();
</script>
</body>
